spring.application.name=backend

# Server
# Render and most hosts inject PORT; 8080 is the local default.
server.port=${PORT:8080}

# Database
# Defaults match backend/docker-compose.yml so local dev works with no .env file.
# Every value is overridable by environment variable, so the same file is used
# unchanged in local, CI, and production; only the environment itself differs.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finora}
spring.datasource.username=${DB_USERNAME:finora}
spring.datasource.password=${DB_PASSWORD:finora}

# JPA / Hibernate
# Flyway owns the schema. Hibernate only validates entities against it and
# never generates or alters a table itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
